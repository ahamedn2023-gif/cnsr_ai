<!DOCTYPE html>
<html>

<head>

<title>Prediction</title>

<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Prediction Result</h1>

<img src="{{ url_for('static',filename='uploads/'+image) }}" style="display:block;">

{% if result=="Benign" %}

<p class="result benign">

✅ Benign

</p>

{% else %}

<p class="result malignant">

⚠️ Malignant
PLEASE CONSULT A DOCTOR IMMEDIATELY

</p>

{% endif %}

<br>

<a href="/">

<button>

Predict Another Image

</button>

</a>

</div>

</body>

</html>
