<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f8;
            color: #173b42;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        .result-image {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 18px;
            margin: 20px;
        }

        .prediction {
            font-size: 28px;
            font-weight: bold;
            margin: 15px;
        }

        .confidence {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            margin: 8px;
            border-radius: 12px;
            text-decoration: none;
            background: #087f8c;
            color: white;
        }

        .button:hover {
            background: #05636d;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Skin Analysis Result</h1>

    <img src="{{ image_path }}"
         alt="Uploaded skin image"
         class="result-image">

    <div class="prediction">
        {{ prediction }}
    </div>

    <div class="confidence">
        Confidence: {{ confidence }}%
    </div>

    <p>
        Anonymous ID: <strong>{{ anonymous_id }}</strong>
    </p>

    <a href="{{ url_for('home') }}" class="button">
        New Prediction
    </a>

    <a href="{{ url_for('history') }}" class="button">
        View History
    </a>

</div>

</body>
</html>
